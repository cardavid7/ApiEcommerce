services:
  - type: web
    name: apiecommerce-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "false"
      - key: ApiSettings__SecretKey
        sync: false
      - key: ConnectionStrings__ConexionSql
        sync: false
      # Verificar que coincidan con las URLs reales que Render asigne a cada
      # servicio (pueden variar si el nombre ya esta tomado).
      - key: Cors__AllowedOrigins__0
        value: https://apiecommerce-frontend.onrender.com
      - key: PublicBaseUrl
        value: https://apiecommerce-backend.onrender.com

  - type: web
    name: apiecommerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/apiecommerce-frontend/browser
    routes:
      # SPA fallback: cualquier ruta profunda (ej. /products/5) debe servir
      # index.html para que el Router de Angular la resuelva en el cliente.
      - type: rewrite
        source: /*
        destination: /index.html
