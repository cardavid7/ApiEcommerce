services:
  - type: web
    name: apiecommerce-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "false"
      - key: ApiSettings__SecretKey
        sync: false
      - key: ConnectionStrings__ConexionSql
        sync: false

