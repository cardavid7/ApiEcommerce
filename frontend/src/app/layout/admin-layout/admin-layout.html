<div class="flex min-h-screen bg-slate-50">
  <aside class="w-56 shrink-0 border-r border-slate-200 bg-white p-4">
    <a routerLink="/" class="mb-6 block text-lg font-bold text-slate-800">ApiEcommerce</a>
    <p class="mb-4 text-xs font-semibold uppercase tracking-wide text-slate-400">Administración</p>
    <nav class="flex flex-col gap-1 text-sm">
      <a
        routerLink="/admin/products"
        routerLinkActive="bg-slate-100 text-slate-900 font-semibold"
        class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-100"
      >
        Productos
      </a>
      <a
        routerLink="/admin/categories"
        routerLinkActive="bg-slate-100 text-slate-900 font-semibold"
        class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-100"
      >
        Categorías
      </a>
      <a
        routerLink="/admin/users"
        routerLinkActive="bg-slate-100 text-slate-900 font-semibold"
        class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-100"
      >
        Usuarios
      </a>
    </nav>

    <div class="mt-8 border-t border-slate-200 pt-4 text-sm">
      <p class="mb-2 text-slate-500">{{ authService.currentUser()?.name }}</p>
      <button type="button" (click)="logout()" class="w-full rounded-md bg-slate-100 px-3 py-1.5 text-left text-slate-700 hover:bg-slate-200">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 p-8">
    <router-outlet />
  </main>
</div>
