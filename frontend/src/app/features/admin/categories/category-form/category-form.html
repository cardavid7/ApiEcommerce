<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-2xl font-bold text-slate-800">{{ isEditMode ? 'Editar categoría' : 'Nueva categoría' }}</h1>

  @if (errorMessage()) {
    <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700" for="name">Nombre</label>
      <input id="name" type="text" formControlName="name" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>

    <div class="flex gap-3">
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Guardando…' : 'Guardar' }}
      </button>
      <a routerLink="/admin/categories" class="rounded-md border border-slate-300 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Cancelar</a>
    </div>
  </form>
</div>
