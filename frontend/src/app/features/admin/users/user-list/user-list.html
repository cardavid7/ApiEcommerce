<h1 class="mb-6 text-2xl font-bold text-slate-800">Usuarios</h1>

@if (errorMessage()) {
  <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
}

@if (isLoading()) {
  <p class="text-slate-500">Cargando…</p>
} @else {
  <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-400">
        <tr>
          <th class="px-4 py-3">Nombre</th>
          <th class="px-4 py-3">Correo</th>
          <th class="px-4 py-3">Roles</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr class="border-b border-slate-100 last:border-0">
            <td class="px-4 py-3 font-medium text-slate-800">{{ user.name }}</td>
            <td class="px-4 py-3 text-slate-500">{{ user.userName }}</td>
            <td class="px-4 py-3">
              @for (role of user.roles; track role) {
                <span class="mr-1 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">{{ role }}</span>
              }
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="px-4 py-6 text-center text-slate-400">No hay usuarios registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
