<div class="mx-auto max-w-lg">
  <h1 class="mb-6 text-2xl font-bold text-slate-800">{{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}</h1>

  @if (errorMessage()) {
    <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700" for="name">Nombre</label>
      <input id="name" type="text" formControlName="name" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700" for="description">Descripción</label>
      <textarea id="description" formControlName="description" rows="3" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="price">Precio</label>
        <input id="price" type="number" step="0.01" formControlName="price" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="stock">Stock</label>
        <input id="stock" type="number" formControlName="stock" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="sku">SKU</label>
        <input id="sku" type="text" formControlName="sku" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="categoryId">Categoría</label>
        <select id="categoryId" formControlName="categoryId" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          <option [value]="0" disabled>Selecciona una categoría</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700" for="image">Imagen</label>
      @if (currentImageUrl()) {
        <img [src]="currentImageUrl()" alt="Imagen actual" class="mb-2 h-24 w-24 rounded-md border border-slate-200 object-cover" />
      }
      <input id="image" type="file" accept="image/*" (change)="onImageSelected($event)" class="w-full text-sm" />
      <p class="mt-1 text-xs text-slate-400">Si no seleccionas una imagen nueva, se conserva la actual.</p>
    </div>

    <div class="flex gap-3">
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Guardando…' : 'Guardar' }}
      </button>
      <a routerLink="/admin/products" class="rounded-md border border-slate-300 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Cancelar</a>
    </div>
  </form>
</div>
