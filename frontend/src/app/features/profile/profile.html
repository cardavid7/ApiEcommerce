@if (authService.currentUser(); as user) {
  <div class="mx-auto max-w-md">
    <h1 class="mb-6 text-2xl font-bold text-slate-800">Mi perfil</h1>

    <dl class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-6">
      <div>
        <dt class="text-xs uppercase tracking-wide text-slate-400">Nombre</dt>
        <dd class="text-slate-800">{{ user.name }}</dd>
      </div>
      <div>
        <dt class="text-xs uppercase tracking-wide text-slate-400">Correo</dt>
        <dd class="text-slate-800">{{ user.userName }}</dd>
      </div>
      <div>
        <dt class="text-xs uppercase tracking-wide text-slate-400">Rol(es)</dt>
        <dd class="flex gap-2">
          @for (role of user.roles; track role) {
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">{{ role }}</span>
          }
        </dd>
      </div>
    </dl>
  </div>
}
